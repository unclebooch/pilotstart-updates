name: Publish signed Pilot Start APK
on:
  push:
    branches: [main]
    paths:
      - 'release-packages/PilotStart-v*.apk.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Prepare Android verification tools
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - name: Verify and publish signed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release-packages/PilotStart-v*.apk.b64)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo 'No Pilot Start APK payloads available.'
            exit 1
          fi
          for file in "${packages[@]}"; do
            version="${file#release-packages/PilotStart-v}"
            version="${version%.apk.b64}"
            if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,4}$ ]]; then
              echo "Unexpected release version: $version"
              exit 1
            fi
            tag="v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; leaving it unchanged."
              continue
            fi
            apk="PilotStart-v${version}.apk"
            base64 --decode "$file" > "$apk"
            if [ "$(stat -c '%s' "$apk")" -lt 10000 ]; then
              echo 'APK appears unexpectedly small'
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > signer.txt
            if ! grep -qi 'SHA-256 digest: 87eb4fbf32a6256d080663f80ef1e1c752d5b24b6be849588e11592d5dfdef24' signer.txt; then
              echo 'Wrong APK signing certificate; refusing publication.'
              exit 1
            fi
            badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1)"
            echo "$badging"
            if [[ "$badging" != *"name='com.pilotstart.app'"* ]] || [[ "$badging" != *"versionName='$version'"* ]]; then
              echo 'APK package or version mismatch; refusing publication.'
              exit 1
            fi
            sha256sum "$apk"
            gh release create "$tag" "$apk" --title "Pilot Start $tag" \
              --notes "Official signed Pilot Start for Android. Install over the previous version to preserve credentials and schedules. Package: com.pilotstart.app. This is an independent app using an unofficial HondaLink interface." \
              --latest
            echo "Published $tag"
          done
